services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: insight
      POSTGRES_PASSWORD: insight
      POSTGRES_DB: insight
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insight -d insight"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      VECTOR_STORE: pgvector
      DATABASE_URL: postgresql+psycopg://insight:insight@db:5432/insight
      # Swap these two for `openai` and add OPENAI_API_KEY for real generation.
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"

  # One-shot: indexes sample_docs/ into Postgres, then exits.
  seed:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      VECTOR_STORE: pgvector
      DATABASE_URL: postgresql+psycopg://insight:insight@db:5432/insight
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    command: ["python", "-m", "scripts.ingest", "sample_docs"]
    restart: "no"

volumes:
  pgdata:
